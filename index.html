<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYPP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="title-screen">
      <div class="title-card">
        <h1>BYPP</h1>
        <p class="tagline">게임을 통해 나를 알아가는 여행</p>

        <div class="auth-row">
          <form id="login-form" class="auth-form">
            <h3>로그인</h3>
            <input id="login-username" type="text" placeholder="아이디" autocomplete="username" required />
            <input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
            <button type="submit">로그인</button>
          </form>

          <div class="auth-divider"></div>

          <form id="signup-form" class="auth-form">
            <h3>회원가입</h3>
            <input id="signup-username" type="text" placeholder="아이디" autocomplete="username" required />
            <input id="signup-password" type="password" placeholder="비밀번호" autocomplete="new-password" required />
            <button type="submit">회원가입</button>
          </form>
        </div>

        <p id="auth-message"></p>

        <div id="welcome-back" class="hidden">
          <p>환영합니다, <strong id="welcome-username"></strong>님!</p>
          <button id="start-game-btn">게임 시작</button>
          <button id="logout-btn">다른 계정으로</button>
        </div>
      </div>
    </div>

    <div id="game-container" class="hidden"></div>

    <div id="ui-root" class="hidden">
      <div id="inventory-panel" class="modal hidden">
        <div class="modal-content">
          <h2>인벤토리</h2>
          <p class="panel-label">강점</p>
          <ul id="inventory-list"></ul>
          <p class="panel-label">아이템</p>
          <ul id="normal-item-list"></ul>
          <button id="close-inventory">닫기</button>
        </div>
      </div>

      <div id="thought-book" class="modal hidden">
        <div class="book-wrap">
          <h2 class="book-title">생각의 책</h2>
          <div class="book-spread">
            <div class="book-page">
              <div id="question-list-left" class="question-list"></div>
            </div>
            <div class="book-spine"></div>
            <div class="book-page">
              <div id="question-list-right" class="question-list"></div>
            </div>
          </div>
          <button id="close-book">닫기 (ESC)</button>
        </div>
      </div>

      <div id="combination-table" class="modal hidden">
        <div class="craft-session">
          <div class="modal-content craft-inventory-content">
            <h2>내 강점</h2>
            <div id="craft-source" class="craft-source"></div>
          </div>
          <div class="modal-content">
            <h2>조합대</h2>
            <div id="craft-grid" class="craft-grid"></div>
            <button id="combine-btn">조합하기</button>
            <p id="combine-result"></p>
            <button id="close-table">닫기 (ESC)</button>
          </div>
        </div>
      </div>

      <div id="garden" class="modal hidden">
        <div class="modal-content">
          <h2>정원 꾸미기</h2>
          <select id="garden-item-select"></select>
          <div id="garden-grid" class="garden-grid"></div>
          <button id="close-garden">닫기</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
